# Mantém o servidor grátis do Render acordado (ele dorme após ~15 min sem
# acesso e demora ~50 s para voltar). Grátis em repositórios públicos.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: curl --silent --show-error --fail --max-time 90 --retry 2 https://screen-share-activity.onrender.com/health
